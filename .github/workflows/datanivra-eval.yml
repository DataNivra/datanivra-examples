name: datanivra-eval
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test-data:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # GitHub's short-lived identity token; no stored DataNivra secret
    env:
      DATANIVRA_BASE_URL: https://api.datanivra.com
      DATANIVRA_CONFIG_DIR: /tmp/datanivra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install datanivra-cli==0.3.0
      - name: Verify variables are set
        run: |
          echo "TENANT length: ${#TENANT}"
          echo "AUDIENCE length: ${#AUDIENCE}"
          echo "WORKLOAD_ID length: ${#WORKLOAD_ID}"
          python3 -c "import re; v='${TENANT}'; print('tenant repr:', repr(v)); print('slug valid:', bool(re.fullmatch(r\"^[a-z0-9][a-z0-9-]{0,62}$\", v)))"
        env:
          TENANT: ${{ vars.DATANIVRA_TENANT }}
          AUDIENCE: ${{ vars.DATANIVRA_AUDIENCE }}
          WORKLOAD_ID: ${{ vars.DATANIVRA_WORKLOAD_IDENTITY_ID }}
      - name: Sign in as this pipeline
        run: datanivra login --url https://api.datanivra.com --workload-identity "${{ vars.DATANIVRA_WORKLOAD_IDENTITY_ID }}" --tenant "${{ vars.DATANIVRA_TENANT }}" --audience "${{ vars.DATANIVRA_AUDIENCE }}" --make-default
      - name: Request test data within the approved profile
        id: req
        run: |
          datanivra test-data request --profile-ref ci-eval@1 --scenario FS_EVERYDAY_BANKING=100 --purpose-ref EVAL-1 -o json > req.json
          echo "id=$(python3 -c 'import json;print(json.load(open("req.json"))["id"])')" >> "$GITHUB_OUTPUT"
      - name: Wait until the data is ready
        run: datanivra test-data wait "${{ steps.req.outputs.id }}" --timeout 600 --interval 10
      - name: Your tests would run here
        run: echo "Test data is ready in lab-ci"
      - name: Release the data
        if: always()
        run: |
          datanivra login --url https://api.datanivra.com --workload-identity "${{ vars.DATANIVRA_WORKLOAD_IDENTITY_ID }}" --tenant "${{ vars.DATANIVRA_TENANT }}" --audience "${{ vars.DATANIVRA_AUDIENCE }}" --make-default
          datanivra test-data release "${{ steps.req.outputs.id }}" --reason-code TEST_RUN_FINISHED
