# Repository checks: secret scan (history included), synthetic-data policy and workflow lint.
# Third-party actions are pinned to full commit SHAs; tools are downloaded at pinned versions and
# verified against SHA-256 checksums before they run. The token is read-only.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Install gitleaks and actionlint (pinned, sha256-verified)
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/gitleaks.tar.gz" "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/tools/gitleaks.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/tools/gitleaks.tar.gz" -C "$RUNNER_TEMP/tools" gitleaks
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/actionlint.tar.gz" "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/tools/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/tools/actionlint.tar.gz" -C "$RUNNER_TEMP/tools" actionlint
          install -m 0755 "$RUNNER_TEMP/tools/gitleaks" "$RUNNER_TEMP/tools/actionlint" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret scan (working tree and history)
        run: |
          gitleaks dir . --config .gitleaks.toml --redact --no-banner
          gitleaks git . --config .gitleaks.toml --redact --no-banner

      - name: Synthetic-data policy
        run: python3 .github/scripts/check_synthetic_data.py

      - name: Workflow lint
        run: actionlint
