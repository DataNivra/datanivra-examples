# yaml-language-server: $schema=https://www.datanivra.com/schemas/v1/manifests/test-data-request.schema.json
# DataNivra test-data-request manifest (apiVersion datanivra.io/v1alpha1). Validate: datanivra test-data validate <file>
apiVersion: datanivra.io/v1alpha1
kind: TestDataRequest
metadata:
  name: refund-regression
spec:
  profile: { name: retail-orders, version: 1 }
  scenarios:
    - { scenario_code: RET_EVERYDAY_SHOPPING, count: 300 }
    - { scenario_code: RET_RETURNS_AND_REFUNDS, count: 100 }
    - { scenario_code: RET_PAYMENT_DECLINES, count: 50 }
