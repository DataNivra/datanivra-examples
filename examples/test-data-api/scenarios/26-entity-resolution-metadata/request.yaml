# yaml-language-server: $schema=https://www.datanivra.com/schemas/v1/manifests/test-data-request.schema.json
# DataNivra test-data-request manifest (apiVersion datanivra.io/v1alpha1). Validate: datanivra test-data validate <file>
apiVersion: datanivra.io/v1alpha1
kind: TestDataRequest
metadata:
  name: healthcare-entity-resolution-pr
  description: >
    Request masked healthcare data with entity resolution metadata columns.
    Requires a profile that has an identity graph configured (see README.md).
spec:
  profile: { name: healthcare-integration-with-identity-graph, version: 1 }
  purpose_ref: QA-ER-001
  include_entity_resolution_metadata: true
